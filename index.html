<style>
/* Layout: one narrow column, phone-first. Home is four full-colour game tiles; each game owns one accent (--g). */
:root{
  --bg:#f1f2f8; --surface:#ffffff; --surface2:#e6e8f2; --fg:#161a30; --muted:#585e7e; --line:#d5d9ea;
  --pan:#c2255c; --spd:#0b7285; --spy:#5f3dc4; --drw:#1864ab; --tab:#c2410c; --who:#2b8a3e;
  --ong:#ffffff; --danger:#c92a2a; --ok:#2b8a3e; --cs:85%; --cl:92%; --cf:28%; --gold:#e8a400; --goldbg:#fff3cc;
  --g:var(--pan);
  --font-d:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-b:'Vazirmatn',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1226; --surface:#181c38; --surface2:#242950; --fg:#eceefa; --muted:#a0a7cf; --line:#2f3560;
    --pan:#f06595; --spd:#3bc9db; --spy:#9775fa; --drw:#4dabf7; --tab:#ffa94d; --who:#69db7c; --ong:#10132b; --danger:#ff8787; --ok:#69db7c; --cs:40%; --cl:22%; --cf:88%; --gold:#ffd43b; --goldbg:#3a3000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1226; --surface:#181c38; --surface2:#242950; --fg:#eceefa; --muted:#a0a7cf; --line:#2f3560;
  --pan:#f06595; --spd:#3bc9db; --spy:#9775fa; --drw:#4dabf7; --tab:#ffa94d; --who:#69db7c; --ong:#10132b; --danger:#ff8787; --ok:#69db7c; --cs:40%; --cl:22%; --cf:88%; --gold:#ffd43b; --goldbg:#3a3000;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-b); font-size:15px; line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 48px;
}
#app{max-width:560px;margin:0 auto}
#app[data-game="draw"]{--g:var(--drw)}
#app[data-game="tab"]{--g:var(--tab)}
#app[data-game="who"]{--g:var(--who)}
#app[data-game="spd"]{--g:var(--spd)}
#app[data-game="spy"]{--g:var(--spy)}
button{font:inherit;color:inherit}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
h2{font-size:18px}
h3{font-size:15px}
.brand{font-family:var(--font-d);font-size:64px;line-height:1.1;margin:18px 0 0;font-weight:400}
.lead{margin:2px 0 6px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.topbar .ttl{font-family:var(--font-d);font-size:26px;color:var(--g);line-height:1.2;flex:1;text-align:center}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--surface2);font-weight:700;cursor:pointer;min-height:46px;text-align:center}
.btn.pri{background:var(--g);color:var(--ong)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.ok{background:var(--ok);color:var(--ong)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.big{min-height:64px;font-size:18px;border-radius:18px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:18px 18px;background:var(--g);color:var(--ong);cursor:pointer;text-align:right;width:100%}
.tile svg{width:54px;height:54px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--font-d);font-size:28px;font-weight:400;display:block;line-height:1.3}
.tile span{font-size:13.5px;opacity:.92}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dot.lg{width:28px;height:28px}
.in,select.in,textarea.in{font:inherit;width:100%;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}
textarea.in{min-height:130px;resize:vertical}
.in.num{width:90px;text-align:center}
.sw8{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swc.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.team{padding:12px 0;border-bottom:1px solid var(--line)}
.team:last-of-type{border-bottom:0}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.field .lab{flex:1;min-width:0}
.field .lab small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface2);font-weight:800;font-size:18px;cursor:pointer}
.stp output{min-width:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.sw{width:52px;height:30px;border-radius:99px;background:var(--surface2);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--g)}
.sw[aria-checked="true"]::after{background:var(--ong);transform:translateX(-22px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px;min-height:38px}
.chip.sel{background:var(--g);border-color:var(--g);color:var(--ong)}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--surface2);font-weight:600}
.pill.g{background:var(--g);color:var(--ong)}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lvl{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;font-weight:700;min-height:62px}
.lvl small{display:block;font-weight:500;color:var(--muted)}
.lvl.sel{background:var(--g);border-color:var(--g);color:var(--ong)}
.lvl.sel small{color:var(--ong);opacity:.9}
.lvl:disabled{opacity:.35;cursor:not-allowed}
.turnbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.turnbar b{font-size:17px}
.clock{display:flex;flex-direction:column;gap:8px;align-items:center}
.clock .num{font-family:var(--font-d);font-size:68px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.track{width:100%;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;direction:ltr}
.track i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .25s linear}
.wordcard{background:var(--surface);border:2px solid var(--g);border-radius:22px;padding:22px 14px;text-align:center}
.word{font-family:var(--font-d);font-size:40px;line-height:1.4;overflow-wrap:anywhere}
.word.sm{font-size:26px}
.forb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.forb span{background:var(--danger);color:var(--ong);border-radius:10px;padding:3px 12px;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .full{grid-column:1/-1}
.cnt{display:flex;gap:10px;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
.cnt span{background:var(--surface2);border-radius:12px;padding:4px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--g);border-color:var(--g);color:var(--ong)}
.sum{margin:8px 0 0;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.sum .t{border-bottom:0;font-weight:800;font-size:18px;color:var(--g)}
.sum dt,.sum dd{margin:0}
.sum dd{font-variant-numeric:tabular-nums;font-weight:700}
.tbwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl th{background:var(--surface2);font-size:12px}
.tbl td:first-child,.tbl th:first-child{text-align:right;white-space:normal;min-width:96px}
.tbl tr:last-child td{border-bottom:0}
.tbl .tt{font-weight:800;color:var(--g)}
.tbl .sub{display:block;color:var(--muted);font-size:11.5px;line-height:1.4}
.ib{border:0;background:var(--surface2);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rank .n{font-family:var(--font-d);font-size:30px;width:34px;text-align:center;color:var(--muted)}
.rank.first{background:var(--g);color:var(--ong);border-color:var(--g)}
.rank.first .n{color:var(--ong)}
.rank .rsc{margin-inline-start:auto;font-family:var(--font-d);font-size:30px}
.cdn{font-family:var(--font-d);font-size:140px;line-height:1.1;text-align:center;color:var(--g)}
#cv{display:block;width:100%;height:clamp(230px,44vh,420px);background:#fff;border-radius:16px;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .swc{width:30px;height:30px}
.tools .sz{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.tools .sz i{background:var(--fg);border-radius:50%;display:block}
.tools .sz.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g) inset}
.md{position:fixed;inset:0;background:rgba(10,12,30,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md[hidden]{display:none}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom,0px));direction:rtl;font-family:var(--font-b)}
.hint{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:13.5px}
.warn{color:var(--danger);font-weight:700}

.hero{position:relative}
.hero .art{width:100%;height:auto;max-height:128px;display:block}
.hdr{display:flex;gap:8px;flex-wrap:wrap}
.tile{position:relative;overflow:hidden;min-height:96px}
.tile .deco{position:absolute;inset-inline-start:-34px;bottom:-46px;width:130px;height:130px;border-radius:50%;background:var(--ong);opacity:.13}
.tile::after{content:"";position:absolute;inset-inline-start:46px;top:-20px;width:58px;height:58px;border-radius:18px;transform:rotate(18deg);background:var(--ong);opacity:.1}
.tile>div,.tile>svg{position:relative;z-index:1}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sc{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 11px;font-size:13.5px}
.sc.now{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc) inset}
.sc .pts{font-family:var(--font-d);font-size:19px;color:var(--tc);line-height:1}
.sc em{font-style:normal;background:var(--tc);color:#fff;border-radius:99px;padding:0 9px;font-size:11.5px;font-weight:700}
.turnbanner{display:flex;align-items:center;gap:12px}
.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-family:var(--font-d);font-size:28px;color:#fff;flex:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px 6px;min-height:94px;border-radius:18px;border:2px solid transparent;cursor:pointer;background:hsl(var(--h) var(--cs) var(--cl));color:hsl(var(--h) 55% var(--cf));font-weight:700;font-size:13px;line-height:1.35}
.cat svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat.sel{background:var(--g);color:var(--ong);border-color:var(--fg)}
.cat:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
@media (max-width:360px){.cats{grid-template-columns:repeat(2,1fr)}}
.lvl{display:flex;align-items:center;gap:10px;text-align:right}
.coin{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-size:21px;background:var(--surface2)}
.lvl.t0 .coin{background:#b2f2bb;color:#14532d}
.lvl.t1 .coin{background:#ffec99;color:#5c4400}
.lvl.t2 .coin{background:#ffc9a8;color:#7a2e00}
.lvl.t3 .coin{background:#ffa8a8;color:#7a1010}
.lvl.tj{grid-column:1/-1;background:var(--goldbg);border-color:var(--gold)}
.lvl.tj .coin{background:var(--gold);color:#3a2a00;width:48px;height:48px;font-size:24px}
.lvl.sel,.lvl.tj.sel{background:var(--g);border-color:var(--g);color:var(--ong)}
.clock .num.low{color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 3.4s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
.trophy{width:96px;height:96px;display:block;margin:4px auto 0}
.award{display:flex;align-items:center;gap:10px}
.rules li{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.conf{display:none}.clock .num.low{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.brand{font-size:52px}.word{font-size:34px}.clock .num{font-size:58px}}

.cat:disabled,.lvl:disabled{filter:grayscale(1);opacity:.4}#cv{touch-action:none}body{overscroll-behavior:none}
</style>

<div id="app" dir="rtl" lang="fa"></div>
<div id="md" class="md" hidden dir="rtl" lang="fa"><div class="sheet" id="sheet"></div></div>

<script>

function appendWordBank(target,extra){
  Object.keys(extra).forEach(cat=>{
    if(!target[cat]) target[cat]=['','','','',''];
    const old=target[cat];
    for(let i=0;i<5;i++){
      const a=(old[i]||'').split('|').map(x=>x.trim()).filter(Boolean);
      const seen=new Set(a.map(x=>x.normalize('NFC').toLocaleLowerCase('fa')));
      (extra[cat][i]||'').split('|').map(x=>x.trim()).filter(Boolean).forEach(w=>{
        const k=w.normalize('NFC').toLocaleLowerCase('fa'); if(!seen.has(k)){a.push(w);seen.add(k)}
      });
      old[i]=a.join('|');
    }
    target[cat]=old;
  });
}

function allCats(type){
  const base=type==='draw'?DBK:PBK,o={};
  for(const k in base)o[k]=base[k];
  CU.cats.forEach(c=>{if(c.words.length){const l={};l[c.pts]=c.words.slice();o[c.name]=l}});
  if(CU.favs.length){const l={};CU.favs.forEach(f=>{(l[f.pts]=l[f.pts]||[]).push(f.word)});o[FAV]=l}
  return o;
}
const isCustom=n=>n===FAV||CU.cats.some(c=>c.name===n);
function levelsFor(type,cat,aud,lock){
  const all=allCats(type)[cat];if(!all)return[];
  const has=l=>all[l]&&all[l].length>0;
  if(isCustom(cat))return Object.keys(all).map(Number).filter(has).sort((a,b)=>a-b);
  if(cat===SPEC)return (aud!=='kids'&&!lock)?[15,20].filter(has):[];
  const p=ptsOf(cat);
  if(lock)return has(p[3])?[p[3]]:[];
  const out=p.filter((l,i)=>AUD[aud].lv.includes(i)&&has(l));
  return out;
}
function visibleCats(type,aud,lock){
  const all=allCats(type);
  return Object.keys(all).filter(c=>{
    if(aud==='kids'&&!AUD.kids.cats.includes(c)&&!isCustom(c))return false;
    return levelsFor(type,c,aud,lock).length>0;
  });
}
function pick(type,cat,lvl,avoid){
  const pool=allCats(type)[cat][lvl];const u=USED[type]=USED[type]||{};
  if(!Array.isArray(pool)||!pool.length)return 'کلمه‌ای در این دسته وجود ندارد';
  let c=pool.filter(w=>!u[cat+'|'+w]&&w!==avoid);
  if(!c.length){pool.forEach(w=>delete u[cat+'|'+w]);c=pool.filter(w=>w!==avoid);if(!c.length)c=pool.slice()}
  const w=c[Math.floor(Math.random()*c.length)];u[cat+'|'+w]=1;LS.set('dh_used',USED);return w;
}
function pickTab(avoid){
  const u=USED.tab=USED.tab||{};
  let c=TB.filter(x=>!u[x]&&x!==avoid);
  if(!c.length){TB.forEach(x=>delete u[x]);c=TB.filter(x=>x!==avoid)}

  const p=x.split(':');return{w:p[0],f:p[1].split(','),raw:x};
}

  return `<div class="strip">${G.set.teams.map((t,i)=>`<div class="sc ${i===act?'now':''}" style="--tc:${TC[t.color]}"><span class="dot" style="background:${TC[t.color]}"></span><b>${esc(t.name)}</b><span class="pts">${fa(teamTotal(i))}</span>${i===act?'<em>نوبت</em>':''}</div>`).join('')}</div>`;
}
function viewPrep(){
  const q=cur(),s=G.set,tm=s.teams[q.team],g=G.type,pd=g==='pan'||g==='draw';
  const idx=G.queue.slice(0,G.cursor+1).filter(x=>x.round===q.round).length,cnt=G.queue.filter(x=>x.round===q.round).length;
  const head=`<div class="card turnbanner"><span class="avatar" style="background:${TC[tm.color]}">${esc(Array.from(tm.name)[0]||'؟')}</span><div class="grow"><b style="font-size:18px">نوبت ${esc(tm.name)}</b><div class="muted sm">${roundLabel(q.round)} · نوبت ${fa(idx)} از ${fa(cnt)}${performer(q.team)?` · ${g==='tab'?'توضیح‌دهنده':g==='draw'?'نقاش':g==='who'?'':'اجراکننده'}${g==='who'?'':': '}${esc(performer(q.team))}`:''}</div></div><button class="btn ghost sm" data-a="board">جدول</button></div>${strip(q.team)}`;
  if(g==='spd'){
    return `<div class="stack">${topbar('home',GT.spd.n)}${head}<div class="card stack"><h3>امتیاز هر کلمه</h3><div class="lvls">${[1,2,3].map(l=>`<button class="lvl t${l-1} ${P.lvl===l?'sel':''}" data-a="pl" data-v="${l}"><span class="coin">${fa(l)}</span><span>${TIERN[l-1]}<small>هر کلمه ${fa(l)} امتیاز</small></span></button>`).join('')}</div></div>${P.lvl?`<div class="hint">زمان این نوبت: ${fmt(s.duration)} · کلمه‌ها از همه دسته‌ها تصادفی می‌آیند</div>`:''}<button class="btn pri big block" data-a="go" ${P.lvl?'':'disabled'}>ورود به بازی</button></div>`;
  }
  if(g==='tab'){
    return `<div class="stack">${topbar('home',GT.tab.n)}${head}<div class="card stack"><p style="margin:0">توضیح‌دهنده گوشی را برمی‌دارد و فقط خودش کارت را می‌بیند. هر کلمه‌ای که درست حدس زده شود ۱ امتیاز می‌گیرد و هر کلمه ممنوعه ۱ امتیاز کم می‌کند.</p><div class="hint">زمان: ${fmt(s.duration)}</div></div><button class="btn pri big block" data-a="go">ورود به بازی</button></div>`;
  }
  const used={cats:new Set(),lvls:new Set()};
  if(pd)G.records.filter(r=>r.round===q.round&&r.team!==q.team).forEach(r=>{used.cats.add(r.cat);used.lvls.add(r.lvl)});
  const jackUsed=(G.jack||[]).includes(q.team);
  const cats=visibleCats(g,s.aud,P.lock);
  const bu=(c,l)=>pd&&s.comp&&G.burn&&G.burn[c+'|'+l];
  const allB=c=>{const o=levelsFor(g,c,s.aud,P.lock);return o.length>0&&o.every(l=>bu(c,l))};
  let reset=false;if(pd&&s.comp&&cats.length&&cats.every(allB)){G.burn={};saveG();reset=true}
  const catAll=pd&&s.noRepCat&&cats.every(c=>used.cats.has(c));
  const catBtns=cats.map(c=>{const dis=pd&&s.noRepCat&&used.cats.has(c)&&!catAll||allB(c);return `<button class="cat ${P.cat===c?'sel':''}" style="--h:${catHue(c)}" data-a="pc" data-v="${esc(c)}" ${dis?'disabled':''}>${catIcon(c)}<span>${esc(c)}</span></button>`}).join('');
  let lv='';
  if(P.cat){
    const opts=levelsFor(g,P.cat,s.aud,P.lock);
    const free=opts.filter(l=>l<15&&!(pd&&s.noRepLvl&&used.lvls.has(l)));
    if(P.lvl&&!opts.includes(P.lvl))P.lvl=null;if(P.lvl&&bu(P.cat,P.lvl))P.lvl=null;
    if(P.cat===SPEC&&jackUsed)P.lvl=null;
    const btn=l=>{
      const tier=l>=15?'tj':'t'+Math.max(0,ptsOf(P.cat).indexOf(l));
      const dis=(l>=15&&jackUsed)||bu(P.cat,l)||(pd&&l<15&&s.noRepLvl&&used.lvls.has(l)&&free.length>0);
      return `<button class="lvl ${tier} ${P.lvl===l?'sel':''}" data-a="pl" data-v="${l}" ${dis?'disabled':''}>${g!=='who'?`<span class="coin">${fa(l)}</span>`:''}<span>${lvName(P.cat,l)}${l>=15?`<small>${jackUsed?'این گروه قبلا استفاده کرده':'هر گروه فقط یک‌بار در کل بازی'}</small>`:''}</span></button>`;
    };
    lv=`<div class="card stack"><h3>سختی و امتیاز</h3><div class="lvls">${opts.map(btn).join('')}</div></div>`;
  }
  const extra=pd&&P.cat&&s.extraCats.includes(P.cat)&&s.extraSec>0;
  const d=P.cat?dur(P.cat):s.duration;
  return `<div class="stack">${topbar('home',GT[g].n)}${head}${reset?'<div class="hint">همه انتخاب‌ها سوخته بودند؛ رقابت از نو شروع شد</div>':''}${P.lock?'<div class="hint">دور نهایی: فقط کلمه‌های بسیار سخت</div>':''}<div class="card stack"><h3>دسته را انتخاب کن</h3><div class="cats">${catBtns}</div></div>${lv}${P.cat?`<div class="hint">زمان این نوبت: ${fmt(d)}${extra?` (شامل ${fa(s.extraSec)} ثانیه اضافه)`:''}</div>`:''}<button class="btn pri big block" data-a="go" ${P.cat&&P.lvl?'':'disabled'}>ورود به بازی</button></div>`;
}
function dur(cat){const s=G.set;return s.duration+((G.type==='pan'||G.type==='draw')&&s.extraCats.includes(cat)?s.extraSec:0)}

/* ---------- بازی ---------- */
const CV={strokes:[],col:'#111111',w:4,er:false,cur:null,c:null,d:1};
function beginTurn(){
  const g=G.type;if(P.cat&&P.lvl){G.burn=G.burn||{};G.burn[P.cat+'|'+P.lvl]=1;saveG()}
  T={cat:P.cat,lvl:P.lvl,stage:'reveal',word:'',card:null,skips:0,faults:0,hist:[],ok:0,tb:0,ps:0,remainMs:0,total:0,outcome:'no',timeLeft:0,peek:true,endAt:0,lastS:-1};
  CV.strokes=[];CV.cur=null;
  if(g==='tab'){T.total=G.set.duration;T.stage='ready';T.card=pickTab()}
  else if(g==='spd'){SPP=spdPools();T.total=G.set.duration;T.word=spdPick();T.stage='ready';T.peek=true}
  else{T.total=dur(P.cat);T.word=pick(g,P.cat,P.lvl);T.stage=g==='who'?'ready':'reveal';T.peek=g!=='draw'}
  T.remainMs=T.total*1000;
  go('play');
}
function startRun(){
  if(!T.started){T.started=true;if(T.cat===SPEC){G.jack=G.jack||[];const tq=cur().team;if(!G.jack.includes(tq))G.jack.push(tq);saveG()}}
  T.stage='run';T.endAt=Date.now()+T.remainMs;T.lastS=-1;
  clearInterval(tick);tick=setInterval(tickFn,200);beep(1,.01);render();musicStart();wl(true);
}
function stopClock(){musicStop();wl(false);clearInterval(tick);tick=null;T.remainMs=Math.max(0,T.endAt-Date.now())}
function tickFn(){
  const ms=T.endAt-Date.now(),s=Math.max(0,Math.ceil(ms/1000));
  if(s!==T.lastS){T.lastS=s;saveT();const el=$('#tm');if(el){el.textContent=fmt(s);el.classList.toggle('low',s<=10)}if(s<=5&&s>0)beep(880,.08)}
  const b=$('#bar');if(b)b.style.width=Math.max(0,ms/(T.total*1000)*100)+'%';
  if(ms<=0)timeUp();
}
function timeUp(){
  musicStop();wl(false);clearInterval(tick);tick=null;T.remainMs=0;T.timeLeft=0;T.stage='done';T.outcome=(G.type==='pan'||G.type==='draw')?'no':'done';
  beep(440,.5);go('result');
}
function finishOk(){
  stopClock();T.timeLeft=Math.floor(T.remainMs/1000);T.stage='done';T.outcome='ok';beep(988,.15);go('result');
}
function startCD(){
  T.stage='cd';T.cd=3;beep(660,.1);render();
  const step=()=>{if(!T||T.stage!=='cd')return;T.cd--;if(T.cd<=0){startRun();return}beep(660,.1);render();setTimeout(step,1000)};
  setTimeout(step,1000);
}
function nextWord(){
  const g=G.type;
  if(g==='tab'){T.card=pickTab(T.card&&T.card.raw)}else if(g==='spd')T.word=spdPick(T.word);else T.word=pick(g,T.cat,T.lvl,T.word);
  updWord();
}
function updWord(){
  const w=$('#word');
  if(G.type==='tab'){if(w)w.textContent=T.card.w;const f=$('#forb');if(f)f.innerHTML=T.card.f.map(x=>`<span>${esc(x)}</span>`).join('')}
  else if(w)w.textContent=T.peek?T.word:'• • •';
  const set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=fa(v)};
  set('c_ok',T.ok);set('c_pt',T.ok*(T.lvl||1));set('c_tb',G.type==='tab'?T.faults:T.tb);set('c_ps',T.ps);set('c_sk',T.skips);
  const st=$('#fav');if(st)st.textContent=isFav(T.word)?'ذخیره‌شده':'ذخیره کلمه';
}
const isFav=w=>CU.favs.some(f=>f.word===w);

function viewPlay(){
  const q=cur(),tm=G.set.teams[q.team],g=G.type;
  const head=`<div class="turnbar"><span class="dot" style="background:${TC[tm.color]}"></span><b>${esc(tm.name)}</b><span class="muted sm">${roundLabel(q.round)}</span>${T.cat?`<span class="pill">${esc(T.cat)}</span>`:''}${T.lvl&&g!=='who'?`<span class="pill g">${lvName(T.cat,T.lvl)} · ${fa(T.lvl)}</span>`:''}</div>`;
  const sec=T.stage==='run'?Math.max(0,Math.ceil((T.endAt-Date.now())/1000)):Math.ceil(T.remainMs/1000);
  const clock=`<div class="clock"><div class="num" id="tm">${fmt(sec)}</div><div class="track"><i id="bar" style="width:${(T.remainMs/(T.total*1000)*100).toFixed(1)}%"></i></div></div>`;

  let body='';

  if(st==='reveal'){
    body=`${clock}<div class="wordcard"><div class="muted">کلمه پنهان است</div><div class="word">• • •</div></div><div class="muted sm" style="text-align:center">فقط ${g==='draw'?'نقاش':'بازیکن اجراکننده'} کلمه را ببیند.</div><button class="btn pri big block" data-a="show">دیدن کلمه</button>${back}`;
  }else if(st==='viewed'){
    const pdv=g==='pan'||g==='draw';
    body=`${clock}<div class="wordcard"><div class="word" id="word">${esc(T.word)}</div></div>${pdv?`<div class="acts"><button class="btn" data-a="skip" ${(G.set.skipOn&&T.skips<smax())?'':'disabled'}>کلمه بعدی (−۱)</button><button class="btn" data-a="undo" ${T.hist.length?'':'disabled'}>↶ برگشت</button></div><div class="cnt"><span>کسر رد کردن: <b id="c_sk">${fa(T.skips)}</b></span></div>`:''}<div class="row"><button class="btn ghost sm grow" data-a="fav" id="fav">${isFav(T.word)?'ذخیره‌شده':'ذخیره کلمه'}</button><button class="btn ghost sm grow" data-a="hide">پنهان کن</button></div><button class="btn pri big block" data-a="run">شروع بازی</button>`;
  }else if(st==='ready'){
    body=`${clock}<div class="card stack"><p style="margin:0">${g==='tab'?'توضیح‌دهنده آماده باشد. بعد از زدن «شروع»، اولین کارت نمایش داده می‌شود.':g==='spd'?'آماده‌ای؟ بعد از «شروع» ۳ ثانیه مهلت داری، بعد کلمه‌ها یکی‌یکی می‌آیند. با هر حدس درست «درست» را بزن تا کلمه بعدی بیاید؛ اگر کلمه‌ای سخت بود «کلمه بعدی» را بزن.':'گوشی را طوری بگیر که صفحه رو به بقیه باشد و خودت آن را نبینی. بعد از «شروع»، ۳ ثانیه مهلت داری.'}</p></div><button class="btn pri big block" data-a="${(g==='who'||g==='spd')?'cd':'run'}">شروع</button>${g==='tab'?'':back}`;
  }else if(st==='cd'){
    body=`<div class="cdn">${fa(T.cd)}</div>`;
  }else if(st==='paused'){
    body=`${clock}<div class="card" style="text-align:center"><b>بازی متوقف شد</b><div class="muted sm">زمان نمی‌گذرد.</div></div><button class="btn pri big block" data-a="resumeRun">ادامه</button><button class="btn danger block" data-a="endnow">پایان نوبت</button>`;
  }else if(st==='run'){
    const skipBtn=g==='pan'||g==='draw'?((G.set.skipOn&&T.skips<smax())?`<button class="btn big" data-a="skip">کلمه بعدی (−۱)</button>`:`<button class="btn big" disabled>رد کردن غیرفعال</button>`):'';
    const undo=`<button class="btn" data-a="undo">↶ برگشت</button>`,pause=`<button class="btn" data-a="pause">⏸ توقف</button>`;
    if(g==='pan'){
      body=`${clock}<div class="wordcard"><div class="word" id="word">${T.peek?esc(T.word):'• • •'}</div></div><div class="row"><button class="btn ghost sm grow" data-a="peek">نمایش / پنهان</button><button class="btn ghost sm grow" data-a="fav" id="fav">${isFav(T.word)?'ذخیره‌شده':'ذخیره کلمه'}</button></div><div class="acts"><button class="btn ok big full" data-a="ok">✓ درست حدس زده شد</button>${skipBtn}${undo}<button class="btn full" data-a="pause">⏸ توقف</button></div><div class="cnt"><span>کسر رد کردن: <b id="c_sk">${fa(T.skips)}</b></span></div>`;
    }else if(g==='draw'){
      const cols=['#111111','#e03131','#1c7ed6','#2f9e44','#f08c00','#9c36b5'],szs=[3,7,14];
      body=`${clock}<button class="btn ghost block" data-a="peek"><span id="word">${T.peek?esc(T.word):'• • •'}</span></button><canvas id="cv"></canvas><div class="tools">${cols.map(c=>`<button class="swc ${CV.col===c&&!CV.er?'on':''}" style="background:${c};${c==='#111111'?'box-shadow:0 0 0 1px var(--line) inset':''}" data-a="pen" data-v="${c}" aria-label="رنگ قلم"></button>`).join('')}${szs.map(z=>`<button class="sz ${CV.w===z?'on':''}" data-a="psz" data-v="${z}" aria-label="ضخامت"><i style="width:${z+2}px;height:${z+2}px"></i></button>`).join('')}<button class="btn sm ${CV.er?'pri':''}" data-a="eras">پاک‌کن</button><button class="btn sm" data-a="stund">↶ خط</button><button class="btn sm" data-a="clr">صفحه جدید</button></div><div class="acts"><button class="btn ok big full" data-a="ok">✓ درست حدس زده شد</button>${skipBtn}${undo}<button class="btn full" data-a="pause">⏸ توقف</button></div>`;
    }else if(g==='tab'){
      body=`${clock}<div class="wordcard"><div class="word" id="word">${esc(T.card.w)}</div><div class="muted sm" style="margin-top:10px">کلمه‌های ممنوعه</div><div class="forb" id="forb">${T.card.f.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="cnt"><span>درست <b id="c_ok">${fa(T.ok)}</b></span><span>خطا <b id="c_tb">${fa(T.faults)}</b></span><span>رد <b id="c_ps">${fa(T.ps)}</b></span></div><div class="acts"><button class="btn ok big" data-a="tok">✓ درست (+۱)</button><button class="btn danger big" data-a="ttb">⚠ خطا (ممنوعه)</button><button class="btn" data-a="tps">⤼ رد کردن</button>${undo}${pause}</div>`;
    }else{
      body=`${clock}<div class="wordcard"><div class="word" id="word" style="font-size:52px">${esc(T.word)}</div></div><div class="cnt"><span>درست <b id="c_ok">${fa(T.ok)}</b></span>${g==='spd'?`<span>امتیاز <b id="c_pt">${fa(T.ok*T.lvl)}</b></span>`:''}<span>${g==='spd'?'تعویض':'پاس'} <b id="c_ps">${fa(T.ps)}</b></span></div><div class="acts"><button class="btn ok big" data-a="wok">✓ درست</button>${(G.set.skipOn||g==='spd')?`<button class="btn big" data-a="wps">${g==='spd'?'⤼ کلمه بعدی':'⤼ پاس'}</button>`:'<span></span>'}${undo}${pause}</div>`;
    }
  }
  return `<div class="stack">${head}${(st==='run'||st==='cd')?'':strip(q.team)}${body}${(st==='run'&&(g==='pan'||g==='draw')&&G.set.warn!==false)?faultUI():''}</div>`;
}
const ftxt=()=>fa(T.faults)+' هشدار'+(T.faults>2?' · کسر '+fa(FP(T.faults)):'');
const faultUI=()=>`<div class="row"><button class="btn danger grow" data-a="flt">⚠ خطا</button><span class="muted sm" id="c_ft">${ftxt()}</span></div>`;
function postPlay(){if(G.type==='draw'&&T&&T.stage==='run')initCanvas()}

/* بوم نقاشی */
function initCanvas(){
  const c=$('#cv');if(!c)return;CV.c=c;CV.d=Math.min(2,window.devicePixelRatio||1);sizeCv();
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}CV.cur={col:CV.er?'#ffffff':CV.col,w:CV.er?CV.w*2.4:CV.w,p:[pt(e)]};CV.strokes.push(CV.cur);paintAll()};
  c.onpointermove=e=>{if(!CV.cur)return;e.preventDefault();CV.cur.p.push(pt(e));paintAll()};
  const end=()=>{CV.cur=null;saveT()};c.onpointerup=end;c.onpointercancel=end;
}
function sizeCv(){const c=CV.c,r=c.getBoundingClientRect();c.width=Math.max(10,Math.round(r.width*CV.d));c.height=Math.max(10,Math.round(r.height*CV.d));paintAll()}
function paintAll(){
  const c=CV.c;if(!c)return;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.lineCap='round';x.lineJoin='round';
  CV.strokes.forEach(s=>{x.strokeStyle=s.col;x.lineWidth=s.w*CV.d;x.beginPath();s.p.forEach((p,i)=>{const px=p[0]*c.width,py=p[1]*c.height;if(i)x.lineTo(px,py);else{x.moveTo(px,py);if(s.p.length===1)x.lineTo(px+.1,py)}});x.stroke()});
}
window.addEventListener('resize',()=>{if(view==='play'&&CV.c&&CV.c.isConnected)sizeCv()});
function toolSel(){
  document.querySelectorAll('[data-a="pen"]').forEach(b=>b.classList.toggle('on',!CV.er&&b.dataset.v===CV.col));
  document.querySelectorAll('[data-a="psz"]').forEach(b=>b.classList.toggle('on',+b.dataset.v===CV.w));
  const e=$('[data-a="eras"]');if(e)e.classList.toggle('pri',CV.er);
}

/* ---------- نتیجه نوبت ---------- */
function calc(){
  const ok=T.outcome==='ok';
  return{wp:ok?T.lvl:0,tp:ok&&G.set.timeBonus?Math.floor(T.timeLeft/30):0,pen:T.skips+(G.set.warn===false?0:FP(T.faults))};
}
function viewResult(){
  const q=cur(),tm=G.set.teams[q.team],g=G.type;
  const head=`<div class="turnbar"><span class="dot" style="background:${TC[tm.color]}"></span><b>${esc(tm.name)}</b><span class="muted sm">${roundLabel(q.round)}</span></div>`;
  let inner='';
  if(g==='pan'||g==='draw'){
    const c=calc(),ok=T.outcome==='ok',t=c.wp+c.tp-c.pen;
    inner=`<div class="card"><div class="muted sm">${esc(T.cat)} · ${lvName(T.cat,T.lvl)}</div><div class="word sm">${esc(T.word)}</div><div class="seg"><button class="${ok?'on':''}" data-a="oc" data-v="ok">درست حدس زده شد</button><button class="${!ok?'on':''}" data-a="oc" data-v="no">حدس زده نشد</button></div>
    <dl class="sum"><div><dt>امتیاز کلمه</dt><dd>${fa(c.wp)}</dd></div>${G.set.timeBonus?`<div><dt>امتیاز زمان (${fa(T.timeLeft)} ثانیه مانده)</dt><dd>${fa(c.tp)}</dd></div>`:''}
    <div><dt>کسر (رد کردن + خطا)</dt><dd class="row nowrap"><button class="btn sm" data-a="rs" data-d="-1">−</button><span>${fa(c.pen)}</span><button class="btn sm" data-a="rs" data-d="1">+</button></dd></div>
    <div class="t"><dt>جمع این دور</dt><dd>${fa(t)}</dd></div></dl></div>`;
  }else if(g==='spd'){

/* ---------- بازی سرعتی: استخر کلمات ---------- */
let SPP=null;
function spdPools(){
  const all=allCats('pan'),seen=new Set(),out={1:[],2:[],3:[]};
  [1,2,3].forEach(l=>{for(const c in all){
    if(c===SPEC||c===PROV)continue;
    const a=all[c][l];if(!Array.isArray(a))continue;
    a.forEach(w=>{w=w.trim();const q=w.normalize('NFC');
      if(!w||seen.has(q))return;
      if(l<3&&wc(w)>1)return;
      seen.add(q);out[l].push(w)})}});
  return out;
}
function spdPick(avoid){
  SPP=SPP||spdPools();
  const pool=SPP[T.lvl]||[];
  if(!pool.length)return 'کلمه‌ای وجود ندارد';
  const u=USED.spd=USED.spd||{};
  let c=pool.filter(w=>!u[w]&&w!==avoid);
  if(!c.length){pool.forEach(w=>delete u[w]);c=pool.filter(w=>w!==avoid);if(!c.length)c=pool.slice()}
  const w=c[Math.floor(Math.random()*c.length)];u[w]=1;LS.set('dh_used',USED);return w;
}

/* ---------- بازی جاسوس ---------- */
let SY=null,spt=null,SYT=null;
const SPSKIP=new Set([SPEC,PROV,FAV]);
function spyCats(lv){
  const all=allCats('pan'),o=[];
  for(const c in all){if(SPSKIP.has(c))continue;const a=all[c][lv];if(Array.isArray(a)&&a.some(w=>wc(w)<=lv))o.push(c)}
  return o;
}
function spyPool(){
  const lv=ST.spyLv,all=allCats('pan'),cats=(ST.spyCat&&all[ST.spyCat])?[ST.spyCat]:Object.keys(all),seen=new Set(),out=[];
  cats.forEach(c=>{
    if(SPSKIP.has(c))return;
    const a=all[c][lv];if(!Array.isArray(a))return;
    a.forEach(w=>{w=w.trim();const q=w.normalize('NFC');if(w&&wc(w)<=lv&&!seen.has(q)){seen.add(q);out.push({w,c})}});
  });
  return out;
}
function spyStart(){
  const pool=spyPool();if(!pool.length)return;
  const u=USED.spy=USED.spy||{};
  let c=pool.filter(x=>!u[x.w]);
  if(!c.length){pool.forEach(x=>delete u[x.w]);c=pool.slice()}
  const it=c[Math.floor(Math.random()*c.length)];u[it.w]=1;LS.set('dh_used',USED);
  const n=ST.spyN,k=Math.min(ST.spyK,Math.max(1,n-1)),ix=[];
  for(let i=0;i<n;i++)ix.push(i);
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=ix[i];ix[i]=ix[j];ix[j]=t}
  const spies=ix.slice(0,k).sort((a,b)=>a-b);
  SY={n,k,word:it.w,cat:it.c,spies,pts:(SYT&&TN)?TN.teams.map(()=>0):[],i:0,stage:'pass',total:ST.spyDur,remainMs:ST.spyDur*1000,endAt:0,lastS:-1,hint:ST.spyHint!==false};
  go('spy');
}
function viewSpySet(){
  const s=ST,maxK=Math.max(1,s.spyN-2);
  if(s.spyK>maxK){s.spyK=maxK;saveST()}
  const cats=spyCats(s.spyLv);
  if(s.spyCat&&!cats.includes(s.spyCat)){s.spyCat='';saveST()}
  const cnt=spyPool().length;
  return `<div class="stack">${topbar('home',SYT?'تورنمنت · جاسوس (دور '+fa(SYT.round)+' از '+fa(SYT.rounds)+')':GT.spy.n,'<button class="btn ghost sm" data-a="rules">راهنما</button>')}<p class="lead">${GT.spy.d}</p>
  <div class="card">${stp('تعداد نفرات','spyN',s.spyN,3,20,1,' نفر')}${stp('تعداد جاسوس','spyK',s.spyK,1,maxK,1,' نفر','حداکثر '+fa(maxK)+' نفر برای این تعداد بازیکن')}${stp('زمان بحث','spyDur',s.spyDur,60,900,30,' ثانیه')}${tog('نمایش دسته به جاسوس','spyHint',s.spyHint!==false,'جاسوس فقط اسم دسته را می‌داند، نه کلمه را')}</div>
  <div class="card stack"><h3>سختی کلمه</h3><div class="chips">${[1,2,3].map(l=>`<button class="chip ${s.spyLv===l?'sel':''}" data-a="spylv" data-v="${l}">${TIERN[l-1]} (${fa(l)} امتیاز)</button>`).join('')}</div>
  <label class="field"><span class="lab">دسته</span><select class="in" id="spycat" style="width:auto;max-width:60%"><option value="">همه دسته‌ها</option>${cats.map(c=>`<option value="${esc(c)}" ${c===s.spyCat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  <div class="muted sm">${fa(cnt)} کلمه آماده است</div></div>
  <button class="btn pri big block" data-a="spystart" ${cnt?'':'disabled'}>شروع بازی</button></div>`;
}
function viewSpy(){
  const y=SY,p=y.i+1,isSpy=y.spies.includes(y.i);
  const sec=y.stage==='run'?Math.max(0,Math.ceil((y.endAt-Date.now())/1000)):Math.ceil(y.remainMs/1000);
  const clock=`<div class="clock"><div class="num" id="tm">${fmt(sec)}</div><div class="track"><i id="bar" style="width:${(y.remainMs/(y.total*1000)*100).toFixed(1)}%"></i></div></div>`;
  let body='';
  const bar=`${topbar('home',GT.spy.n)}`;
  if(y.stage==='pass'){
    body=`<div class="card rolebox"><div class="muted">نفر ${fa(p)} از ${fa(y.n)}</div><div class="role">بازیکن ${fa(p)}</div><p style="margin:0">گوشی را به بازیکن ${fa(p)} بده. فقط خودش باید صفحه را ببیند.</p></div><button class="btn pri big block" data-a="spshow">نمایش نقش من</button>`;
  }else if(y.stage==='show'){
    body=`<div class="wordcard rolebox"><div class="muted">بازیکن ${fa(p)}</div>${isSpy
      ?`<div class="role spy" id="word">🕵 تو جاسوسی!</div><div class="muted sm">کلمه را نمی‌دانی. از حرف بقیه حدس بزن و لو نرو.</div>${y.hint?`<div class="spyline">دسته: ${esc(y.cat)}</div>`:''}`
      :`<div class="muted">کلمه‌ی تو</div><div class="role" id="word">${esc(y.word)}</div><div class="spyline">دسته: ${esc(y.cat)}</div>`}</div><button class="btn pri big block" data-a="sphide">${p<y.n?'پنهان کن و نفر بعدی':'پنهان کن و آماده‌ی شروع'}</button>`;
  }else if(y.stage==='ready'){
    body=`<div class="card rolebox"><div class="role">همه آماده‌اند</div><p style="margin:0">${fa(y.n)} نفر · ${fa(y.k)} جاسوس · زمان بحث ${fmt(y.total)}</p><p class="muted sm" style="margin:0">درباره‌ی کلمه حرف بزنید ولی مستقیم نگویید. جاسوس باید وانمود کند کلمه را می‌داند.</p></div><button class="btn pri big block" data-a="spgo">شروع بحث و تایمر</button>`;
  }else if(y.stage==='run'||y.stage==='paused'){
    body=`${clock}<div class="card rolebox"><p style="margin:0">بحث جریان دارد؛ جاسوس کیست؟</p></div><div class="acts">${y.stage==='run'?'<button class="btn" data-a="sppause">⏸ توقف</button>':'<button class="btn pri" data-a="spgo">ادامه</button>'}<button class="btn danger" data-a="spend">پایان و افشا</button></div>`;
  }else if(y.stage==='time'){
    body=`${clock}<div class="card rolebox"><div class="role">⏰ وقت تمام شد!</div><p style="margin:0">رأی بدهید جاسوس کیست، بعد «افشا» را بزنید.</p></div><button class="btn pri big block" data-a="spend">افشای نتیجه</button>`;
  }else{
    body=`<div class="wordcard rolebox"><div class="muted">کلمه</div><div class="role">${esc(y.word)}</div><div class="spyline">دسته: ${esc(y.cat)}</div><div class="muted">${y.k>1?'جاسوس‌ها':'جاسوس'}</div><div class="role spy" style="font-size:34px">${y.spies.map(i=>'بازیکن '+fa(i+1)).join('، ')}</div></div>${SYT?spyAward():`<button class="btn pri big block" data-a="spagain">دور جدید با همین تنظیمات</button><button class="btn block" data-a="spset">تغییر تنظیمات</button>`}`;
  }
  return `<div class="stack">${bar}${body}</div>`;
}
function spyAward(){
  return `<div class="card stack"><h3>امتیاز دور ${fa(SYT.round)} از ${fa(SYT.rounds)}</h3><div class="muted sm">امتیاز هر گروه را در این دور وارد کن (مثلاً گروهی که جاسوس را درست پیدا کرد).</div>${TN.teams.map((x,i)=>`<div class="field"><div class="lab"><span class="dot" style="background:${TC[x.color]}"></span> ${esc(x.name)}</div><div class="stp"><button data-a="spp" data-n="${i}" data-d="-1" aria-label="کمتر">−</button><o>${fa(SY.pts[i]||0)}</o><button data-a="spp" data-n="${i}" data-d="1" aria-label="بیشتر">+</button></div></div>`).join('')}</div><button class="btn pri big block" data-a="spsave">${SYT.round<SYT.rounds?'ثبت و دور بعد':'ثبت و پایان بازی جاسوس'}</button>`;
}
function spStop(){clearInterval(spt);spt=null;wl(false);if(SY&&SY.endAt)SY.remainMs=Math.max(0,SY.endAt-Date.now())}
function spTick(){
  const y=SY;if(!y||y.stage!=='run')return;
  const ms=y.endAt-Date.now(),s=Math.max(0,Math.ceil(ms/1000));
  if(s!==y.lastS){y.lastS=s;const el=$('#tm');if(el){el.textContent=fmt(s);el.classList.toggle('low',s<=10)}if(s<=5&&s>0)beep(880,.08)}
  const b=$('#bar');if(b)b.style.width=Math.max(0,ms/(y.total*1000)*100)+'%';
  if(ms<=0){spStop();y.remainMs=0;y.stage='time';beep(440,.6);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}render()}
}
const SPYA={
  spp(b){const i=+b.dataset.n;SY.pts[i]=Math.max(0,(SY.pts[i]||0)+ +b.dataset.d);render()},
  spsave(){if(!SYT)return;
    SY.pts.forEach((v,i)=>{SYT.totals[i]+=v});
    if(SYT.round<SYT.rounds){SYT.round++;spyStart()}
    else{TN.games.push({type:'spy',totals:SYT.totals.slice()});LS.set('dh_tn',TN);SYT=null;go('tnboard')}
  },
  spystart(){spyStart()},
  spagain(){spyStart()},
  spset(){spStop();go('spyset')},
  spylv(b){ST.spyLv=+b.dataset.v;saveST();render()},
  spshow(){SY.stage='show';render()},
  sphide(){if(SY.i+1<SY.n){SY.i++;SY.stage='pass'}else SY.stage='ready';render()},
  spgo(){SY.stage='run';SY.endAt=Date.now()+SY.remainMs;SY.lastS=-1;clearInterval(spt);spt=setInterval(spTick,200);beep(660,.1);wl(true);render()},
  sppause(){spStop();SY.stage='paused';render()},
  spend(){spStop();SY.stage='end';render()}
};
app.addEventListener('change',e=>{if(e.target.id==='spycat'){ST.spyCat=e.target.value;saveST();render()}});

/* ---------- رویدادها ---------- */
const A={
  home(){go('home')},
  pick(b){TNM=false;SG=b.dataset.v;go(SG==='spy'?'spyset':'setup')},
  mine(){ED=null;go('mine')},
  resume(){SG=G.type;TNM=!!G.tn;const sv=LS.get('dh_turn',null);if(sv&&sv.cursor===G.cursor&&G.cursor<G.queue.length){T=sv.T;if(T.stage==='run'||T.stage==='cd')T.stage='paused';CV.strokes=sv.st||[];P={cat:T.cat,lvl:T.lvl,lock:!!cur().lock};go(sv.view==='result'?'result':'play');return}if(G.cursor<G.queue.length){newPrep();go('prep')}else if(G.tn)tnFinish();else go('final')},
  st(b){const k=b.dataset.k;ST[k]=Math.min(+b.dataset.max,Math.max(+b.dataset.min,ST[k]+ +b.dataset.d));saveST();render()},
  tg(b){const k=b.dataset.k;ST[k]=!ST[k];saveST();render()},
  tadd(){if(ST.teams.length<8){ST.teams.push({name:'گروه '+fa(ST.teams.length+1),color:ST.teams.length%8});saveST();render()}},
  tdel(b){ST.teams.splice(+b.dataset.n,1);saveST();render()},
  tcol(b){ST.teams[+b.dataset.n].color=+b.dataset.v;saveST();render()},
  aud(b){ST.aud=b.dataset.v;saveST();render()},
  xc(b){const c=b.dataset.v,i=ST.extraCats.indexOf(c);if(i>=0)ST.extraCats.splice(i,1);else ST.extraCats.push(c);saveST();render()},
  start(){
    ST.teams.forEach((t,i)=>{if(!t.name.trim())t.name='گروه '+fa(i+1)});saveST();
    const set=JSON.parse(JSON.stringify(ST)),q=[];LS.set('dh_turn',null);if(TNM){set.rounds=ST['tr_'+SG];if(!TN)TN={games:[],teams:set.teams.map(t=>Object.assign({},t))}}
    for(let r=1;r<=set.rounds;r++)set.teams.forEach((t,i)=>q.push({team:i,round:r}));
    G={type:SG,set,queue:q,cursor:0,records:[],nid:1,finalAdded:false,jack:[],burn:{},tn:TNM};saveG();newPrep();BR=1;go('prep');
  },
  pc(b){P.cat=b.dataset.v;const o=levelsFor(G.type,P.cat,G.set.aud,P.lock);P.lvl=(P.lock&&o.length)?o[0]:null;render()},
  pl(b){P.lvl=+b.dataset.v;if(G.type==='spd')P.cat='سرعتی';render()},
  go(){beginTurn()},
  tn(){TNM=true;TN=null;LS.set('dh_tn',null);SG='pan';go('setup')},stats(){go('stats')},sttab(b){STT=b.dataset.v;render()},
  tnnext(){const n=TNG.find(x=>!TN.games.some(g=>g.type===x));SG=n;TNM=true;if(n==='spy'){SYT={round:1,rounds:ST.tr_spy,totals:TN.teams.map(()=>0)};go('spyset')}else A.start()},
  prepback(){if(tick){clearInterval(tick);tick=null}if(T&&!T.started&&G.burn&&T.cat)delete G.burn[T.cat+'|'+T.lvl];T=null;newPrep();go('prep')},
  show(){T.stage='viewed';render()},
  hide(){T.stage='reveal';render()},
  run(){startRun()},
  cd(){startCD()},
  peek(){T.peek=!T.peek;updWord()},
  fav(){
    const i=CU.favs.findIndex(f=>f.word===T.word);
    if(i>=0)CU.favs.splice(i,1);else CU.favs.push({word:T.word,cat:T.cat,pts:Math.min(T.lvl||1,8)});
    saveCU();updWord();
  },
  pause(){stopClock();T.stage='paused';render()},
  resumeRun(){startRun()},
  endnow(){timeUp()},
  ok(){finishOk()},
  skip(){
    if(!G.set.skipOn||T.skips>=smax())return;
    T.hist.push({k:'s',prev:T.word,prevStrokes:G.type==='draw'?JSON.parse(JSON.stringify(CV.strokes)):null});T.skips++;nextWord();if(G.type==='draw'){CV.strokes=[];paintAll()}if(T.stage==='viewed')render();else{const sb=document.querySelector('[data-a="skip"]');if(sb&&T.skips>=smax())sb.disabled=true}
  },
  flt(){T.hist.push({k:'f'});T.faults++;beep(300,.25);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}const e=$('#c_ft');if(e)e.textContent=ftxt()},
  mtr(b){ST.musicTrack=+b.dataset.v;saveST();render()},
  undo(){
    const h=T.hist.pop();if(!h)return;if(h.k==='f'){T.faults--;const e=$('#c_ft');if(e)e.textContent=ftxt();return}
    const g=G.type;
    if(h.k==='s'){T.skips--;T.word=h.prev;if(g==='draw'&&h.prevStrokes){CV.strokes=h.prevStrokes;CV.cur=null;paintAll()}}
    else if(g==='tab'){if(h.k==='c')T.ok--;else if(h.k==='t'){T.faults--;T.tb=FP(T.faults)}else T.ps--;T.card=h.prevCard}
    else{if(h.k==='c')T.ok--;else T.ps--;T.word=h.prev}
    updWord();if(T.stage==='viewed')render();
  },
  tok(){T.hist.push({k:'c',prevCard:T.card});T.ok++;nextWord()},
  ttb(){T.hist.push({k:'t',prevCard:T.card});T.faults++;T.tb=FP(T.faults);beep(300,.25);nextWord()},
  tps(){T.hist.push({k:'p',prevCard:T.card});T.ps++;nextWord()},
  wok(){T.hist.push({k:'c',prev:T.word});T.ok++;nextWord()},
  wps(){if(!G.set.skipOn&&G.type!=='spd')return;T.hist.push({k:'p',prev:T.word});T.ps++;nextWord()},
  pen(b){CV.col=b.dataset.v;CV.er=false;toolSel()},
  psz(b){CV.w=+b.dataset.v;toolSel()},
  eras(){CV.er=!CV.er;toolSel()},
  stund(){CV.strokes.pop();paintAll()},
  clr(){CV.strokes=[];paintAll()},
  oc(b){T.outcome=b.dataset.v;render()},
  rs(b){T.skips=Math.max(0,T.skips+ +b.dataset.d);render()},
  rc(b){const k=b.dataset.k;T[k]=Math.max(0,T[k]+ +b.dataset.d);render()},
  back2(){T.stage='paused';T.outcome='no';go('play');setTimeout(()=>startRun(),0)},
  save(){saveTurn()},
  board(){BR=G.cursor>0?G.queue[Math.min(G.cursor,G.queue.length)-1].round:1;go('board')},
  br(b){BR=b.dataset.v==='all'?'all':+b.dataset.v;render()},
  next(){if(G.cursor<G.queue.length){newPrep();go('prep')}else if(G.tn)tnFinish();else go('final')},
  edit(b){openEdit(b.dataset.id)},
  mclose(){closeModal()},
  eok(b){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');recalcEdit()},
  esave(b){
    const r=G.records.find(x=>x.id==b.dataset.id);if(!r)return;
    const pd=G.type==='pan'||G.type==='draw';
    const ids=pd?['e_sk','e_tl','e_wp','e_tp','e_pn']:['e_wp','e_tp','e_pn'];
    const vals={};
    for(const id of ids){
      const el=$('#'+id),v=el?Number(el.value):NaN;
      if(!Number.isFinite(v)||v<0||v>10000){alert('مقادیر امتیاز، کسر و زمان باید عددی و بین صفر تا ۱۰۰۰۰ باشند.');if(el)el.focus();return}
      vals[id]=Math.round(v);
    }
    if(pd){
      const tl=vals.e_tl,sk=vals.e_sk;
      if(tl>3600||sk>1000){alert('زمان باقی‌مانده حداکثر ۳۶۰۰ ثانیه و تعداد رد کردن حداکثر ۱۰۰۰ است.');return}
      r.cat=$('#e_cat').value;r.lvl=+$('#e_lvl').value;r.ok=$('#e_ok').getAttribute('aria-checked')==='true';r.skips=sk;r.timeLeft=tl;
    }
    r.wordPts=vals.e_wp;r.timePts=vals.e_tp;r.penalty=vals.e_pn;
    saveG();closeModal();render();
  },
  edel(b){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='تأیید: '+b.textContent;return}
    const i=G.records.findIndex(x=>x.id==b.dataset.id);if(i<0)return;
    const r=G.records[i];if(G.burn&&r.cat)delete G.burn[r.cat+'|'+r.lvl];G.records.splice(i,1);if(r.cat===SPEC&&G.jack)G.jack=G.jack.filter(x=>x!==r.team);
    if(b.dataset.redo==='1')G.queue.splice(G.cursor,0,{team:r.team,round:r.round,lock:r.round>G.set.rounds});
    saveG();closeModal();render();
  },
  finalround(){
    const rk=ranking(),fin=rk.filter(x=>x.s>=rk[1].s);
    fin.forEach(x=>G.queue.push({team:x.i,round:G.set.rounds+1,lock:G.type!=='tab'}));
    G.finalAdded=true;saveG();newPrep();BR=G.set.rounds+1;go('prep');
  },
  again(){SG=G.type;A.start()},
  newgame(){SYT=null;LS.set('dh_turn',null);TN=null;TNM=false;LS.set('dh_tn',null);G=null;LS.set('dh_game',null);go('home')},
  ced(b){ED=+b.dataset.n;render()},
  ccancel(){ED=null;render()},
  cdel(b){CU.cats.splice(+b.dataset.n,1);ED=null;saveCU();render()},
  fdel(b){CU.favs.splice(+b.dataset.n,1);saveCU();render()},
  csave(){
    let name=$('#cn').value.trim();const pts=+$('#cp').value;
    const words=[...new Set($('#cw').value.split('\n').map(x=>x.trim()).filter(Boolean))];
    if(!name||!words.length){alert('نام دسته و دست‌کم یک کلمه را وارد کن.');return}
    if(PBK[name]||DBK[name]||name===FAV){alert('این نام برای یک دستهٔ پیش‌فرض رزرو شده است؛ نام دیگری انتخاب کن.');return}
    const duplicate=CU.cats.some((c,i)=>i!==ED&&c.name.trim().toLocaleLowerCase()===name.toLocaleLowerCase());
    if(duplicate){alert('دسته‌ای با این نام وجود دارد. نام یکتایی انتخاب کن.');return}
    const c={name,pts,words};
    if(ED!=null)CU.cats[ED]=c;else CU.cats.push(c);
    ED=null;saveCU();render();
  },
  rules(){const g=SG;sheet.innerHTML=`<div class="stack"><h2>راهنمای ${GT[g].n}</h2><ul class="rules" style="margin:0;padding-inline-start:20px">${RULES[g].map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn pri" data-a="mclose">متوجه شدم</button></div>`;md.hidden=false},
  snd(){SND=SND===false;LS.set('dh_snd',SND);render()},
  theme(){THEME=THEME==='dark'?'light':THEME==='light'?'':'dark';LS.set('dh_theme',THEME);if(THEME)document.documentElement.setAttribute('data-theme',THEME);else document.documentElement.removeAttribute('data-theme');render()},
  resetused(b){USED={};LS.set('dh_used',USED);b.textContent='پاک شد'}
};
Object.assign(A,SPYA);
function onClick(e){
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a==='back'){return}
  const f=A[b.dataset.a];if(f)f(b,e);try{saveT()}catch(x){}
}
app.addEventListener('click',onClick);
md.addEventListener('click',e=>{if(e.target===md){closeModal();return}onClick(e)});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.i==='tn'){ST.teams[+t.dataset.n].name=t.value;saveST()}else if(t.dataset&&t.dataset.i==='tp'){ST.teams[+t.dataset.n].players=t.value;saveST()}});
sheet.addEventListener('input',e=>{if(e.target.classList.contains('rc'))recalcEdit()});
sheet.addEventListener('change',e=>{if(e.target.classList.contains('rc'))recalcEdit()});
if(THEME)document.documentElement.setAttribute('data-theme',THEME);
render();
})();
</script>
